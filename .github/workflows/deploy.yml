# 顯示在 GitHub Actions 分頁的名稱
name: Deploy to GitHub Pages

# 觸發條件：
# - main 有 push → 重新部署（正式版 + 預覽版）
# - preview 分支有 push → preview 分支上的「Preview trigger」跑完後觸發這裡
#   （workflow_run 一律以 main 的身分執行，符合 github-pages 環境只允許 main 部署的規則）
# - 手動觸發
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Preview trigger"]
    branches: [preview]
    types: [completed]
  workflow_dispatch:

# 權限設定：允許 Action 讀取程式碼並寫入 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一次部署，新的觸發會排隊等前一次完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 第一階段：建置環境與編譯
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虛擬機

    steps:
      - name: Checkout 正式版（main）
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout 預覽版（preview 分支，不存在就略過）
        id: preview
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: preview
          path: site-preview

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 使用最新 LTS Node.js 以符合 Vite 需求

      - name: 編譯正式版 → /finance-tracker/
        working-directory: site-main
        run: |
          npm ci
          npm run build

      - name: 編譯預覽版 → /finance-tracker/preview/
        if: steps.preview.outcome == 'success'
        working-directory: site-preview
        env:
          FT_PREVIEW: '1'
        run: |
          npm ci
          npm run build
          cp -r dist ../site-main/dist/preview

      - name: 上傳編譯產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-main/dist

  # 第二階段：部署到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build # 必須等 build 階段成功後才執行
    runs-on: ubuntu-latest

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
