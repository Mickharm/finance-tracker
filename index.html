<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <!-- PWA: viewport-fit=cover 讓內容延伸到 Dynamic Island / 瀏海區域 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <!-- PWA: iOS Home Screen App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="記帳助手" />
  <!-- PWA: Theme color（只用淺色主題） -->
  <meta name="theme-color" content="#EAF1FB" />
  <meta name="color-scheme" content="light only" />
  <!-- PWA: Web App Manifest -->
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- 提前與 Firebase 端點握手，縮短第一筆資料同步的等待 -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  <!-- 字體：3.0 起全部使用系統字（SF Pro／SF Pro Rounded／蘋方），不再下載網路字體 -->
  <title>記帳助手</title>
  <script>
    // 極光背景依時段換色：清晨、白天、傍晚、夜晚（在畫面出現前就決定，避免閃一下）
    // 網址加 ?mood=dawn|day|dusk|night 可以強制指定（設計檢查用）
    (function () {
      var h = new Date().getHours();
      var mood = h >= 5 && h < 9 ? 'dawn' : h >= 9 && h < 16 ? 'day' : h >= 16 && h < 19 ? 'dusk' : 'night';
      try { var q = new URLSearchParams(location.search).get('mood'); if (q) mood = q; } catch (e) { /* ignore */ }
      document.documentElement.setAttribute('data-mood', mood);
    })();
  </script>
  <style>
    /* 開啟瞬間（React 還沒載入）的畫面：和 App 內同一片極光＋一顆玻璃圖示 */
    html { --pl-base: #EAF1FB; --pl-1: #9CCBFF; --pl-2: #A6F0D8; --pl-3: #CFC4FF; --pl-4: #FFD0E2; }
    html[data-mood="dawn"]  { --pl-base: #FBF1EC; --pl-1: #FFC7A6; --pl-2: #FFBDD2; --pl-3: #B7DBFF; --pl-4: #FFE4A6; }
    html[data-mood="dusk"]  { --pl-base: #F5EEF7; --pl-1: #FFB39C; --pl-2: #D2B8FF; --pl-3: #FFB6D9; --pl-4: #FFD79E; }
    html[data-mood="night"] { --pl-base: #E8EBFA; --pl-1: #A8B8FF; --pl-2: #CCB4FF; --pl-3: #9DE2DC; --pl-4: #F6BEDF; }
    body { margin: 0; background: var(--pl-base); }
    #pre-loader {
      position: fixed; inset: 0; z-index: 200; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(90% 55% at 0% 0%, var(--pl-1) 0%, transparent 70%),
        radial-gradient(80% 50% at 100% 30%, var(--pl-2) 0%, transparent 70%),
        radial-gradient(90% 55% at 10% 100%, var(--pl-3) 0%, transparent 70%),
        radial-gradient(70% 45% at 100% 0%, var(--pl-4) 0%, transparent 70%),
        var(--pl-base);
    }
    #pre-loader .pl-icon-box {
      width: 6rem; height: 6rem; border-radius: 30px;
      background: linear-gradient(168deg, rgba(255,255,255,.8), rgba(255,255,255,.45));
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,.96), inset 0 -1px 0 rgba(255,255,255,.55), 0 0 0 .5px rgba(22,28,70,.13), 0 14px 34px -20px rgba(38,50,110,.4);
      display: flex; align-items: center; justify-content: center; margin-bottom: 1.75rem;
    }
    #pre-loader .pl-icon-box svg { width: 2.75rem; height: 2.75rem; color: #1F2230; }
    #pre-loader .pl-title {
      font: 800 1.375rem/1.2 -apple-system, BlinkMacSystemFont, "PingFang TC", system-ui, sans-serif;
      color: #14161F; margin: 0 0 1.5rem; letter-spacing: -0.02em;
    }
    #pre-loader .pl-bar-track {
      width: 11rem; height: 8px; border-radius: 9999px; overflow: hidden;
      background: rgba(26,32,80,.07); box-shadow: inset 0 1px 2.5px rgba(26,32,80,.16), 0 1px 0 rgba(255,255,255,.85);
    }
    #pre-loader .pl-bar-fill {
      height: 100%; width: 0%; border-radius: 9999px;
      background: linear-gradient(90deg, #4D5263, #14161F);
      animation: pl-bar-grow 2s ease-out forwards;
    }
    @keyframes pl-bar-grow { 0% { width: 0%; } 100% { width: 15%; } }
  </style>
</head>

<body>
  <div id="root">
    <div id="pre-loader">
      <div class="pl-icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
      </div>
      <h1 class="pl-title">記帳助手</h1>
      <div class="pl-bar-track">
        <div class="pl-bar-fill"></div>
      </div>
    </div>
  </div>
  <script>
    // 看門狗：若 12 秒後 React 仍未掛載（pre-loader 還在），多半是資源載入
    // 在版本交接或網路異常時失敗 — 自動重整一次自救（旗標防無限循環，
    // 成功掛載時由 App 清除）
    setTimeout(function () {
      if (document.getElementById('pre-loader') && !sessionStorage.getItem('pl-reloaded')) {
        sessionStorage.setItem('pl-reloaded', '1');
        location.reload();
      }
    }, 12000);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
